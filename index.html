<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4ece2" media="(prefers-color-scheme: light)">
<meta name="description" content="Learn the 12-hole Alto C ocarina: fingerings, a tuner, lessons and play-along songs.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Vessel · Ocarina Trainer</title>
<style>
/* VOICE  calm practice companion, warm and exact
   IDEA   the instrument itself: a black NIGHT ocarina with clay-coloured fingertips on the holes
   PICTURE the fingering diagram, large, on every screen that teaches a note
   COLOUR graphite instrument, unglazed-clay ground by day, graphite by night, clay accent, mint for in tune
   TYPE   system sans, heavy note names, four sizes */
:root{
  --bg:#f4ece2;--card:#fffaf3;--card2:#efe3d4;--ink:#221e1a;--mute:#6e655b;--line:#e2d4c3;
  --clay:#c4582a;--clay2:#e8814f;--ok:#11866a;--warn:#a86a00;--bad:#c23d2b;--shadow:0 1px 2px rgba(60,40,20,.08),0 6px 20px rgba(60,40,20,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121316;--card:#1b1c20;--card2:#25272c;--ink:#f1ece5;--mute:#a39d95;--line:#2e3036;
  --clay:#e8814f;--clay2:#f09a6c;--ok:#55d1ae;--warn:#f2b84b;--bad:#ff7a63;--shadow:none;color-scheme:dark;
}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans JP",sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:20px;font-weight:750}
p{margin:.5em 0}
sub{font-size:.45em;vertical-align:baseline;position:relative;top:.05em;margin-left:.06em;font-weight:700;opacity:.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;margin-right:auto}
.brand svg{width:30px;height:20px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}

main{max-width:760px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom))}
.view{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.mute{color:var(--mute)}
.small{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.btn{min-height:44px;border-radius:12px;padding:0 16px;font-weight:650;font-size:15px;border:1px solid var(--line);background:var(--card2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--clay);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:transparent}
.btn svg{width:20px;height:20px}
.btn:disabled{opacity:.45;cursor:default}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;min-height:54px;display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;font-weight:650;color:var(--mute);border-radius:12px}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--clay)}
.tabs button[aria-current=page] svg{stroke-width:2.4}

/* ocarina drawing */
.oca{display:block;width:100%;height:auto;max-height:46vh}
.oca .body{fill:url(#og)}
.oca .mouth{fill:#2a2c31}
.oca .under{fill:#24262b;stroke:rgba(255,255,255,.1);stroke-width:1.5}
.oca .rim{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1.5}
.oca .win{fill:#0b0c0e}
.oca .hole{fill:#0a0b0d;stroke:rgba(255,255,255,.28);stroke-width:1.5}
.oca .pad{fill:var(--clay2)}
.oca .shine{fill:rgba(255,255,255,.35)}
.oca .lab{fill:rgba(255,255,255,.55);font:700 11px system-ui,sans-serif;text-anchor:middle}
.oca .cap{fill:var(--mute);font:600 12px system-ui,sans-serif;text-anchor:middle}
.oca .hit{fill:transparent}
.oca.edit .h{cursor:pointer}
.oca.edit .hole{stroke:var(--clay2);stroke-dasharray:3 3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px;border:1.5px solid var(--mute)}
.legend .c{background:var(--clay2);border-color:var(--clay2)}
.legend .hf{background:linear-gradient(90deg,var(--clay2) 50%,transparent 50%);border-color:var(--clay2)}

.note-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big-note{font-size:clamp(48px,14vw,64px);font-weight:850;line-height:1;letter-spacing:-.02em}
.meta{display:grid;gap:2px;margin-right:auto}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mute)}
.badge.clay{background:color-mix(in srgb,var(--clay) 16%,transparent);color:var(--clay)}
.cover{margin:4px 0 0;font-size:15px}

.strip{position:relative;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;scrollbar-width:thin}
.chip{flex:none;scroll-snap-align:center;min-width:52px;height:48px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.chip.acc{font-size:14px;background:var(--card2);min-width:46px}
.chip[aria-pressed=true]{background:var(--clay);border-color:transparent;color:#fff}
.chip.done{opacity:.45}
.chip.oor{border-color:var(--bad);color:var(--bad)}
.chip.rest{font-weight:600;color:var(--mute)}

/* learn */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:center}
.hero .oca{max-height:none}
.stats{display:flex;gap:18px;margin-top:10px}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
details.lesson{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
details.lesson summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;min-height:56px}
details.lesson summary::-webkit-details-marker{display:none}
.lnum{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--card2);font-size:15px}
details[open] .lnum{background:var(--clay);color:#fff}
.lt{font-weight:700;line-height:1.25}
.lsub{font-size:13px;color:var(--mute)}
.lbody{padding:0 16px 16px}
.lbody ul{padding-left:20px;margin:6px 0 12px}
.lbody li{margin:6px 0}

/* tuner */
.tuner{text-align:center}
.t-note{font-size:clamp(72px,24vw,110px);font-weight:850;line-height:1;letter-spacing:-.03em;margin-top:6px}
.t-read{font-size:17px;font-weight:650;min-height:26px}
.meter{position:relative;height:56px;margin:14px 4px 6px;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 22%,transparent),color-mix(in srgb,var(--warn) 20%,transparent) 30%,color-mix(in srgb,var(--ok) 30%,transparent) 42%,color-mix(in srgb,var(--ok) 30%,transparent) 58%,color-mix(in srgb,var(--warn) 20%,transparent) 70%,color-mix(in srgb,var(--bad) 22%,transparent))}
.meter .mid{position:absolute;left:50%;top:6px;bottom:6px;width:2px;background:var(--ink);opacity:.35;transform:translateX(-1px)}
.needle{position:absolute;top:4px;bottom:4px;width:6px;border-radius:3px;background:var(--ink);left:50%;transform:translateX(-3px);transition:left .08s linear;opacity:.2}
.needle.live{opacity:1}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);padding:0 4px}
.hint{font-weight:700;min-height:24px}
.hint.ok{color:var(--ok)}.hint.lo,.hint.hi{color:var(--warn)}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .1s linear}

/* songs */
.song{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);width:100%;text-align:left;min-height:64px}
.song .st{font-weight:700;line-height:1.25}
.song .ss{font-size:13px;color:var(--mute)}
.song .go{margin-left:auto;flex:none;color:var(--clay)}
.list{display:grid;gap:8px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--mute)}
.player .now{display:grid;gap:4px;padding:12px 14px}
.player .big-note{font-size:52px}
.p-next{font-size:15px;color:var(--mute)}
.ctrl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ctrl .btn{min-height:52px;padding:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;background:none;border-radius:10px;font-weight:650;font-size:15px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.slider{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--clay);height:32px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:34px;text-align:center;font-weight:700}
.listen{display:flex;align-items:center;gap:10px;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.done-box{text-align:center;padding:18px 0 6px}
.done-box b{font-size:26px;display:block}

/* dialog */
dialog{border:0;border-radius:22px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,8,6,.55)}
.dlg{padding:20px;display:grid;gap:14px}
label.f{display:grid;gap:6px;font-weight:650;font-size:15px}
input[type=text],textarea,select{width:100%;font-size:16px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;line-height:1.5;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
.preview{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto}
.preview .chip{height:34px;min-width:38px;font-size:14px;border-radius:9px}
.warn{color:var(--warn);font-size:14px;font-weight:600}
.help{font-size:14px;color:var(--mute);background:var(--card2);border-radius:12px;padding:10px 12px}
.help code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:1px 5px;border-radius:5px;color:var(--ink)}
.set-row{display:grid;gap:8px}
.set-row>span{font-weight:650}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:650;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:600px){
  h1{font-size:26px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .oca{max-width:420px;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand" aria-label="Vessel">
    <svg viewBox="0 0 30 20" aria-hidden="true"><ellipse cx="17" cy="10" rx="12" ry="8" fill="var(--ink)"/><rect x="0" y="11" width="9" height="6" rx="3" fill="var(--ink)" transform="rotate(-25 4 14)"/><circle cx="13" cy="7" r="1.6" fill="var(--clay2)"/><circle cx="18" cy="6" r="1.6" fill="var(--clay2)"/><circle cx="23" cy="8" r="1.6" fill="var(--bg)"/></svg>
    <span>Vessel</span>
  </div>
  <button id="installBtn" class="btn sm pri" hidden>Install app</button>
  <button class="icon-btn" data-act="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
  </button>
</header>

<main id="app" tabindex="-1"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5.5c3.2-1.3 6.2-1.1 9 1 2.8-2.1 5.8-2.3 9-1v13c-3.2-1.3-6.2-1.1-9 1-2.8-2.1-5.8-2.3-9-1z"/><path d="M12 6.5v13"/></svg>Learn</button>
  <button data-tab="chart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13c0-4.5 4-8 9.5-8S21 8.5 21 12.5 17 19 12 19s-9-1.5-9-6z"/><circle cx="9" cy="10" r="1.4" fill="currentColor"/><circle cx="12.5" cy="9" r="1.4" fill="currentColor"/><circle cx="16" cy="10.5" r="1.4"/></svg>Fingerings</button>
  <button data-tab="tuner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 17a8.5 8.5 0 0 1 17 0"/><path d="M12 17l4.5-6.5"/><circle cx="12" cy="17" r="1.3" fill="currentColor"/></svg>Tuner</button>
  <button data-tab="songs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 18V5.5l11-2.5v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Songs</button>
</nav>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
{
'use strict';
const app = document.getElementById('app');
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('vessel.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('vessel.' + k, JSON.stringify(v)); } catch (e) {} }
};
const settings = Object.assign({ tuning: 442, names: 'letters', tol: 'normal', labels: true }, store.get('settings', {}));
const saveSettings = () => store.set('settings', settings);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2400); }

/* ---------------- notes ---------------- */
const LOW = 69, HIGH = 89;                       // A4 … F6, the range of a 12-hole Alto C
const NAMES = {
  letters: ['C','C♯','D','E♭','E','F','F♯','G','G♯','A','B♭','B'],
  solfege: ['Do','Do♯','Re','Mi♭','Mi','Fa','Fa♯','Sol','Sol♯','La','Si♭','Si'],
  ja:      ['ド','ド♯','レ','ミ♭','ミ','ファ','ファ♯','ソ','ソ♯','ラ','シ♭','シ']
};
const pc = m => ((m % 12) + 12) % 12;
const nm = m => (NAMES[settings.names] || NAMES.letters)[pc(m)];
const oc = m => Math.floor(m / 12) - 1;
const lab = m => m == null ? '·' : `${nm(m)}<sub>${oc(m)}</sub>`;
const txt = m => m == null ? 'rest' : nm(m) + oc(m);
const hz = m => settings.tuning * Math.pow(2, (m - 69) / 12);
const inR = m => m != null && m >= LOW && m <= HIGH;
const RANGE = []; for (let m = LOW; m <= HIGH; m++) RANGE.push(m);
const isNat = m => [0,2,4,5,7,9,11].includes(pc(m));

/* ---------------- fingerings (Asian 12-hole system, NIGHT subholes at the middle fingers) ---------------- */
const HOLES = ['Lt','Li','Lm','Lr','Lp','Ls','Rt','Ri','Rm','Rr','Rp','Rs'];
function F(str) { const o = {}; HOLES.forEach(h => o[h] = 0); str.split(/\s+/).filter(Boolean).forEach(t => { const [h, v] = t.split(':'); o[h] = v === 'h' ? .5 : 1; }); return o; }
const L5 = 'Lt Li Lm Lr Lp', R5 = 'Rt Ri Rm Rr Rp';
const DEF = {
  69: F(`${L5} ${R5} Ls Rs`), 70: F(`${L5} ${R5} Rs Ls:h`), 71: F(`${L5} ${R5} Rs`),
  72: F(`${L5} ${R5}`), 73: F(`${L5} Rt Ri Rm Rr Rp:h`), 74: F(`${L5} Rt Ri Rm Rr`), 75: F(`${L5} Rt Ri Rm Rp`),
  76: F(`${L5} Rt Ri Rm`), 77: F(`${L5} Rt Ri`), 78: F(`${L5} Rt Rm Rp:h`), 79: F(`${L5} Rt`),
  80: F('Lt Li Lm Lp Rt Rr'), 81: F('Lt Li Lm Lp Rt'), 82: F('Lt Li Lp Rt Rr'), 83: F('Lt Li Lp Rt'),
  84: F('Lt Lp Rt'), 85: F('Lp Rt Rr'), 86: F('Lp Rt'), 87: F('Lm Lp'), 88: F('Lp'), 89: F('')
};
let custom = store.get('fingers', {});
const fing = m => custom[m] || DEF[m];
const FN = { t: 'thumb', i: 'index', m: 'middle', r: 'ring', p: 'pinky', s: 'subhole' };
function coverText(m) {
  if (!inR(m)) return 'Out of range for an Alto C (A4 to F6).';
  const f = fing(m);
  const side = L => { const full = [], half = []; ['t','i','m','r','p','s'].forEach(k => { const v = f[L + k]; if (v === 1) full.push(FN[k]); else if (v === .5) half.push('half ' + FN[k]); }); return full.concat(half); };
  const l = side('L'), r = side('R');
  if (!l.length && !r.length) return 'Every hole open.';
  return `<b>Left</b> ${l.length ? l.join(', ') : 'all off'} &nbsp;·&nbsp; <b>Right</b> ${r.length ? r.join(', ') : 'all off'}`;
}

/* ---------------- the ocarina drawing ---------------- */
const POS = { Lp:[100,130,8], Lr:[124,96,11], Lm:[158,76,12], Li:[196,67,11], Ri:[236,68,11], Rm:[272,76,12], Rr:[304,94,11], Rp:[330,124,9], Ls:[150,52,5.5], Rs:[282,52,5.5] };
const TH = { Lt:[176,228,12], Rt:[248,228,11] };
const LAB = { Lp:'p', Lr:'r', Lm:'m', Li:'i', Ri:'i', Rm:'m', Rr:'r', Rp:'p' };
let ocaN = 0;
function oca(m, opt = {}) {
  const f = inR(m) ? fing(m) : null, labels = opt.labels ?? settings.labels, gid = 'og' + (++ocaN);
  const hole = (id, x, y, r) => {
    const v = f ? f[id] : 0;
    let s = `<g class="h" data-h="${id}"><circle class="hole" cx="${x}" cy="${y}" r="${r}"/>`;
    if (v === 1) s += `<circle class="pad" cx="${x}" cy="${y}" r="${r + 3.5}"/><circle class="shine" cx="${x - r * .35}" cy="${y - r * .38}" r="${r * .32}"/>`;
    else if (v === .5) s += `<path class="pad" d="M${x} ${y - r - 3.5}A${r + 3.5} ${r + 3.5} 0 0 0 ${x} ${y + r + 3.5}Z"/>`;
    if (opt.edit) s += `<circle class="hit" cx="${x}" cy="${y}" r="${Math.max(r + 7, 17)}"/>`;
    return s + '</g>';
  };
  const on = f ? HOLES.filter(h => f[h] === 1).length : 0;

function onTuner(r, dt) {
  const note = $('#tNote'); if (!note) return;
  const needle = $('#tNeedle'), read = $('#tRead'), hint = $('#tHint');
  if (!r) { needle.classList.remove('live'); hint.textContent = ''; hint.className = 'hint'; read.textContent = 'Listening…'; T.out += dt; if (T.out > .15) { T.hold = 0; bar(); } return; }
  const near = Math.round(r.midi), cents = Math.round((r.midi - near) * 100);
  if (onTuner.last !== near) { note.innerHTML = lab(near); onTuner.last = near; $('#tOca').innerHTML = inR(near) ? oca(near, { labels: false }) : ''; }
  read.textContent = `${r.f.toFixed(1)} Hz · ${cents > 0 ? '+' : ''}${cents}¢`;
  needle.classList.add('live'); needle.style.left = (50 + Math.max(-50, Math.min(50, cents))) + '%';
  if (Math.abs(cents) <= 10) { hint.textContent = 'In tune'; hint.className = 'hint ok'; }
  else if (cents < 0) { hint.textContent = 'Flat · blow a little harder'; hint.className = 'hint lo'; }
  else { hint.textContent = 'Sharp · blow a little softer'; hint.className = 'hint hi'; }
  const off = Math.abs((r.midi - T.target) * 100);
  if (off <= 15) { T.out = 0; T.hold += dt; if (T.hold >= 4) { T.count++; T.best = Math.max(T.best, T.hold); T.hold = 0; toast('Four steady seconds. Nice.'); $('#tCount').textContent = `${T.count} done · best ${T.best.toFixed(1)}s`; } }
  else { T.out += dt; if (T.out > .15) { T.best = Math.max(T.best, T.hold); T.hold = 0; } }
  bar();
}
function bar() { const b = $('#tBar'); if (b) b.style.width = Math.min(100, T.hold / 4 * 100) + '%'; }

function afterPlayer() {
  updatePlayer();
  const r = $('#pBpm'); if (r) r.addEventListener('input', () => { P.bpm = +r.value; $('#pBpmV').textContent = P.bpm + ' bpm'; });
}
function updatePlayer() {
  const now = $('#pNow'); if (!now) return;
  const n = P.notes[P.idx], end = P.idx >= P.notes.length;
  if (end) {
    now.innerHTML = `<div class="done-box"><b>Song complete</b><p class="mute">${P.notes.filter(x => x.m != null).length} notes played.</p><button class="btn pri" data-act="restart">Play again</button></div>`;
  } else {
    let nx = null; for (let j = P.idx + 1; j < P.notes.length; j++) if (P.notes[j].m != null) { nx = P.notes[j].m; break; }
    const follow = P.mode === 'follow';
    now.innerHTML = `<div class="note-head"><div class="big-note">${n.m == null ? 'rest' : lab(n.m)}</div><div class="meta"><span class="p-next">${P.idx + 1} of ${P.notes.length}${nx != null ? ` · next ${lab(nx)}` : ''}</span>${n.b !== 1 ? `<span class="small mute">${+n.b.toFixed(2)} beats</span>` : ''}</div></div>

      ${follow ? `<div class="listen"><span class="dot${mic.on ? ' on' : ''}" id="pDot"></span><span id="pHeard">${mic.on ? 'Listening… play the note' : 'Tap Start to let the app listen'}</span></div><p class="small warn" id="micErr"></p>` : ''}`;
  }
  const main = $('#pMain');
  if (main) {
    if (P.mode === 'listen') main.innerHTML = P.playing ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>Pause' : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Play';
    else if (P.mode === 'follow') main.textContent = mic.on ? 'Stop' : 'Start';
    else main.textContent = 'Next';
    main.setAttribute('aria-label', main.textContent.trim());
  }
  const strip = $('#pStrip');
  if (strip) { [...strip.children].forEach((c, i) => { c.setAttribute('aria-pressed', i === P.idx); c.classList.toggle('done', i < P.idx); }); centerChip('#pStrip'); }
}
function playStep() {
  if (!P.playing) return;
  const n = P.notes[P.idx];
  if (!n) { P.playing = false; updatePlayer(); wake(false); return; }
  const sec = 60 / P.bpm * n.b;
  if (inR(n.m)) tone(hz(n.m), Math.max(.12, sec * .9));
  updatePlayer();
  P.timer = setTimeout(() => { P.idx++; playStep(); }, sec * 1000);
}
function stopPlay() { P.playing = false; clearTimeout(P.timer); }
function goIdx(i, sound) {
  P.idx = Math.max(0, Math.min(P.notes.length, i)); P.armed = true; P.hitAt = 0;
  const n = P.notes[P.idx];
  if (sound && n && inR(n.m)) tone(hz(n.m), Math.min(1.2, 60 / P.bpm * n.b * .9));
  updatePlayer();
}
const TOL = { strict: 20, normal: 35, relaxed: 50 };
function onFollow(r, dt, now) {
  const dot = $('#pDot'), heard = $('#pHeard');
  if (P.idx >= P.notes.length) return;
  while (P.notes[P.idx] && (P.notes[P.idx].m == null || !inR(P.notes[P.idx].m))) { P.idx++; updatePlayer(); if (P.idx >= P.notes.length) return; }
  const target = P.notes[P.idx].m;
  if (!r) { P.armed = true; P.hitAt = 0; if (heard) heard.textContent = 'Listening… play ' + txt(target); return; }
  const cents = (r.midi - target) * 100, near = Math.round(r.midi);
  if (heard) heard.innerHTML = `Hearing ${lab(near)} ${Math.abs(cents) <= TOL[settings.tol] ? '· yes!' : cents < 0 ? '· too low' : '· too high'}`;
  if (P.hitRms && r.rms < P.hitRms * .45) P.armed = true;
  if (P.lastHit != null && Math.abs((r.midi - P.lastHit) * 100) > 60) P.armed = true;
  if (Math.abs(cents) <= TOL[settings.tol] && P.armed) {
    if (!P.hitAt) P.hitAt = now;
    if (now - P.hitAt >= 90) { P.lastHit = target; P.hitRms = r.rms; P.armed = false; P.hitAt = 0; P.idx++; updatePlayer(); }
  } else P.hitAt = 0;
}
async function startFollowMic() {
  try { await mic.start(); mic.cb = onFollow; P.armed = true; P.lastHit = null; P.hitRms = 0; updatePlayer(); }
  catch (e) { const el = $('#micErr'); if (el) el.textContent = micError(e); }
}

  const p = parse(f.src.value, ed.fmt), notes = p.notes;
  $('#prev').innerHTML = notes.slice(0, 160).map(n => `<span class="chip${n.m == null ? ' rest' : ''}${n.m != null && !inR(n.m) ? ' oor' : ''}">${n.m == null ? 'rest' : lab(n.m)}</span>`).join('') + (notes.length > 160 ? `<span class="small mute">+${notes.length - 160} more</span>` : '');
  $('#prevInfo').textContent = notes.length ? `${notes.filter(n => n.m != null).length} notes${p.fit ? ` · shifted ${p.fit > 0 ? 'up' : 'down'} ${Math.abs(p.fit) / 12} octave to fit` : ''}` : '';
  const w = [];
  if (p.out) w.push(`${p.out} out of range`);
  if (p.bad.length) w.push('ignored: ' + p.bad.map(b => `“${b}”`).join(' '));
  $('#prevWarn').textContent = w.join(' · ');
}
function saveSong() {
  const f = $('#songForm'), t = f.t.value.trim(), src = f.src.value.trim();
  if (!t) { f.t.focus(); return; }
  const p = parse(src, ed.fmt);
  if (!p.notes.some(n => n.m != null)) { $('#prevWarn').textContent = 'No notes found yet. Paste a sequence above.'; return; }
  let x;
  if (ed.id) { x = mine.find(s => s.id === ed.id); Object.assign(x, { t, src, fmt: ed.fmt }); }
  else { x = { id: 'u' + Date.now().toString(36), t, src, fmt: ed.fmt, tr: 0 }; mine.unshift(x); }
  saveMine(); closeDlg(); toast('Saved'); openSong(x.id);
}
function settingsDlg() {
  const opt = (k, v, l) => `<button type="button" data-act="set" data-k="${k}" data-v="${v}" aria-pressed="${String(settings[k]) === String(v)}">${l}</button>`;
  openDlg(`<div class="dlg">
    <h2>Settings</h2>
    <div class="set-row"><span>Tuning</span><div class="seg">${opt('tuning', 442, 'A = 442 (NIGHT)')}${opt('tuning', 440, 'A = 440')}</div></div>
    <div class="set-row"><span>Note names</span><div class="seg">${opt('names', 'letters', 'C D E')}${opt('names', 'solfege', 'Do Re Mi')}${opt('names', 'ja', 'ドレミ')}</div></div>
    <div class="set-row"><span>Follow mode accepts notes within</span><div class="seg">${opt('tol', 'strict', '±20¢')}${opt('tol', 'normal', '±35¢')}${opt('tol', 'relaxed', '±50¢')}</div></div>
    <div class="set-row"><span>Finger letters on the diagram</span><div class="seg">${opt('labels', true, 'Show')}${opt('labels', false, 'Hide')}</div></div>
    <div class="set-row"><span>Back up your songs</span><div class="row"><button class="btn sm" data-act="export">Copy songs as text</button><button class="btn sm" data-act="import">Restore from text</button></div><textarea id="impBox" rows="3" placeholder="Paste a backup here, then tap Restore" hidden></textarea></div>
    ${Object.keys(custom).length ? `<div class="set-row"><span>Custom fingerings</span><div><button class="btn sm danger" data-act="fresetall">Reset all ${Object.keys(custom).length}</button></div></div>` : ''}
    <div class="row"><button class="btn pri" data-act="close">Done</button></div>
  </div>`);
}

/* ---------------- events ---------------- */
document.addEventListener('click', async e => {
  const tab = e.target.closest('.tabs button');
  if (tab) { if (tab.dataset.tab === 'songs' && view === 'songs' && P.song) { stopPlay(); P.song = null; mic.cb = null; if (mic.on) mic.stop(); } show(tab.dataset.tab); return; }
  const hole = view === 'chart' && C.edit && e.target.closest('.oca .h');
  if (hole) {
    const h = hole.dataset.h, f = Object.assign({}, fing(C.note));
    f[h] = f[h] === 1 ? .5 : f[h] === .5 ? 0 : 1;
    custom[C.note] = f; store.set('fingers', custom);
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const d = a.dataset, n = +d.n;
  switch (d.act) {
    case 'go':
      if (d.view === 'chart') { C.note = n; C.edit = false; }
      if (d.view === 'tuner') { T.target = n; T.hold = 0; }
      show(d.view); break;
    case 'lesson': { const i = +d.i; show('learn'); const el = $('#lesson-' + i); if (el) { el.open = true; el.scrollIntoView({ block: 'start' }); } break; }
    case 'song': openSong(d.id); break;
    case 'add': songEditor(null); break;
    case 'editsong': songEditor(d.id); break;
    case 'delsong': if (a.dataset.confirm) { mine = mine.filter(s => s.id !== d.id); saveMine(); closeDlg(); P.song = null; show('songs', { force: true }); toast('Song deleted'); } else { a.dataset.confirm = 1; a.textContent = 'Tap again to delete'; } break;
    case 'fmt': ed.fmt = d.f; a.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === a)); fmtHelp(); preview(); break;
    case 'close': closeDlg(); break;
    case 'settings': settingsDlg(); break;
    case 'set': {
      const v = d.v === 'true' ? true : d.v === 'false' ? false : isNaN(+d.v) ? d.v : +d.v;
      settings[d.k] = v; saveSettings();
      a.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === a));
      const y = window.scrollY; render(); window.scrollTo(0, y); break;
    }
    case 'export': {
      const data = JSON.stringify({ songs: mine, fingers: custom });
      try { await navigator.clipboard.writeText(data); toast('Copied. Paste it somewhere safe.'); } catch (err) { const b = $('#impBox'); b.hidden = false; b.value = data; b.select(); toast('Select and copy the text'); }
      break;
    }
    case 'import': {
      const b = $('#impBox');
      if (b.hidden) { b.hidden = false; b.value = ''; b.focus(); a.textContent = 'Restore now'; break; }
      try { const o = JSON.parse(b.value); if (Array.isArray(o.songs)) { const ids = new Set(mine.map(s => s.id)); o.songs.filter(s => s && s.id && s.t && typeof s.src === 'string' && !ids.has(s.id)).forEach(s => mine.push({ id: String(s.id), t: String(s.t).slice(0, 60), src: s.src, fmt: FMT_NAME[s.fmt] ? s.fmt : 'notes', tr: +s.tr || 0 })); saveMine(); }
        if (o.fingers && typeof o.fingers === 'object') { Object.entries(o.fingers).forEach(([k, v]) => { if (DEF[k] && v && typeof v === 'object') custom[k] = F(HOLES.filter(h => v[h] === 1).join(' ') + ' ' + HOLES.filter(h => v[h] === .5).map(h => h + ':h').join(' ')); }); store.set('fingers', custom); }
        closeDlg(); toast('Restored'); render();
      } catch (err) { toast('That text is not a Vessel backup'); }
      break;
    }
    case 'fresetall': custom = {}; store.set('fingers', custom); closeDlg(); render(); toast('Fingerings reset'); break;
    case 'cnote': C.note = n; { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'cprev': if (C.note > LOW) { C.note--; const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'cnext': if (C.note < HIGH) { C.note++; const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'edit': C.edit = !C.edit; { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'freset': delete custom[C.note]; store.set('fingers', custom); { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'play': tone(hz(n), 1.4); break;
    case 'mic':
      try { await mic.start(); mic.cb = onTuner; onTuner.last = null; const y = window.scrollY; render(); window.scrollTo(0, y); }
      catch (err) { $('#micErr').textContent = micError(err); }
      break;
    case 'ttarget': T.target = n; T.hold = 0; { const y = window.scrollY; const sl = $('#tStrip').scrollLeft; render(); window.scrollTo(0, y); $('#tStrip').scrollLeft = sl; onTuner.last = null; } break;
    case 'back': stopPlay(); P.song = null; mic.cb = null; if (mic.on) mic.stop(); render(); window.scrollTo(0, 0); break;
    case 'mode':
      stopPlay(); P.mode = d.m;
      if (P.mode !== 'follow') { mic.cb = null; if (mic.on) mic.stop(); }
      a.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === a));
      updatePlayer(); break;
    case 'main':
      if (P.mode === 'listen') { if (P.playing) { stopPlay(); updatePlayer(); } else { if (P.idx >= P.notes.length) P.idx = 0; ac(); P.playing = true; wake(true); playStep(); } }
      else if (P.mode === 'follow') { if (mic.on) { mic.cb = null; mic.stop(); updatePlayer(); } else { if (P.idx >= P.notes.length) P.idx = 0; await startFollowMic(); } }
      else goIdx(P.idx + 1, true);
      break;
    case 'restart': stopPlay(); goIdx(0, P.mode === 'step'); break;
    case 'prev': stopPlay(); goIdx(P.idx - 1, P.mode === 'step'); break;
    case 'next': stopPlay(); goIdx(P.idx + 1, P.mode === 'step'); break;
    case 'jump': stopPlay(); goIdx(+d.i, P.mode !== 'follow'); break;
    case 'tapnote': { const x = P.notes[P.idx]; if (x && inR(x.m)) tone(hz(x.m), Math.min(1.4, 60 / P.bpm * x.b)); break; }
    case 'tr': {
      P.tr += +d.d; if (!P.song.builtin) { P.song.tr = P.tr; saveMine(); }
      const keep = P.idx; retranspose(); P.idx = Math.min(keep, P.notes.length); const y = window.scrollY; render(); window.scrollTo(0, y); break;
    }
  }
});
document.addEventListener('toggle', e => { const el = e.target; if (el.matches && el.matches('details.lesson') && el.open) store.set('lesson', +el.dataset.i); }, true);
document.addEventListener('keydown', e => {
  if (dlg.open || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if (view === 'songs' && P.song) {
    if (e.key === ' ' ) { e.preventDefault(); $('#pMain')?.click(); }
    else if (e.key === 'ArrowRight') { stopPlay(); goIdx(P.idx + 1, P.mode === 'step'); }
    else if (e.key === 'ArrowLeft') { stopPlay(); goIdx(P.idx - 1, P.mode === 'step'); }
  } else if (view === 'chart') {
    if (e.key === 'ArrowRight' && C.note < HIGH) { C.note++; render(); }
    else if (e.key === 'ArrowLeft' && C.note > LOW) { C.note--; render(); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopPlay(); if (mic.on) { mic.stop(); render(); } store.set('stats', stats); } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v !== view) show(v); });

/* ---------------- install + offline ---------------- */
let deferred = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('#installBtn').hidden = false; });
$('#installBtn').addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('#installBtn').hidden = true; });
window.addEventListener('appinstalled', () => { $('#installBtn').hidden = true; toast('Installed. Open Vessel from your home screen.'); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

window.__vessel = { parseNotes, parseButtons, parseNums, DEF, oca, BUILTIN };
show(location.hash.slice(1) || 'learn', { force: true });
}
</script>
</body>
